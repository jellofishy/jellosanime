<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="jellosanime - discover any anime and find where to watch it legally." />
    <meta name="theme-color" content="#0F0F12" />
    <title>jellosanime</title>

    <!-- App icons: favicon.svg = small variant; icon.svg = full app icon (both: dark rounded square, pink "j") -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icon.svg" />

    <!-- Inter font from Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

    <!-- Runs BEFORE the page is drawn so there is no flash of the wrong colors.
         It sets data-theme ("dark" or "light") and data-accent on <html>.
         Saved choice first; otherwise dark (light only if nothing is saved AND the device prefers light).
         If you edit this script, update the sha256 hash in public/_headers (instructions are there). -->
    <script>
      (function () {
        var mode = "dark";
        var accent = "pink";
        try {
          var m = localStorage.getItem("jellosanime-mode");
          var a = localStorage.getItem("jellosanime-accent");
          if (m === "light" || m === "dark") {
            mode = m;
          } else if (window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches) {
            mode = "light";
          }
          if (a === "pink" || a === "purple" || a === "blue" || a === "green" || a === "orange") accent = a;
        } catch (e) {
          // Storage blocked (private mode): stay with the defaults.
        }
        var root = document.documentElement;
        root.setAttribute("data-theme", mode);
        root.setAttribute("data-accent", accent);
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute("content", mode === "light" ? "#F7F7F9" : "#0F0F12");
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
