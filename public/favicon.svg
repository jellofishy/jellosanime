<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Small-size icon: no drop, just a rounded white "j" on the pink to lavender gradient -->
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#C2185B"/>
      <stop offset="1" stop-color="#6D4AE0"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="16" fill="url(#g)"/>
  <!-- stem + hook of the j, drawn as one thick rounded stroke -->
  <path d="M37 20 V40 Q37 49 28 49 Q24 49 21 47" fill="none" stroke="#fff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- dot of the j -->
  <circle cx="37" cy="12.5" r="4.5" fill="#fff"/>
</svg>
